name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Display Python version
        run: python --version && pip --version

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build
          pip list

      - name: Build wheel
        run: |
          python -m build --wheel -v 2>&1
          echo "=== BUILD COMPLETED ==="
          ls -la dist/

      - name: Verify wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          chk-a --version
          chk-a-validate --help

      - name: Debug - show wheel contents
        if: always()
        run: |
          echo "=== WHEEL CONTENTS ==="
          unzip -l dist/*.whl | head -30

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: chk-a-wheel
          path: dist/*.whl
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: chk-a-wheel
          path: dist/

      - name: Prepare release assets
        run: |
          ls -la dist/
          # Copy installation scripts to dist for release
          cp install.sh dist/
          cp uninstall.sh dist/
          cp Makefile dist/
          cp config/config.yaml.example dist/config.yaml.example
          cp config/chk-a.env.example dist/env.example
          cp systemd/chk-a.service dist/
          cp logrotate.d/chk-a dist/logrotate.chk-a
          # Copy scripts directory for systemd wrapper
          cp -r scripts dist/
          # Copy img directory for daily/anomaly/recovery images
          cp -r img dist/
          # Create scripts tarball for easy download
          tar -czf dist/scripts.tar.gz -C dist scripts
          # Create img tarball
          tar -czf dist/img.tar.gz -C dist img
          # Verify all assets exist
          echo "=== VERIFY ASSETS ==="
          ls -la dist/
          tar -tzf dist/scripts.tar.gz | head -5
          tar -tzf dist/img.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "chk-a ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist/*.whl
            dist/install.sh
            dist/uninstall.sh
            dist/Makefile
            dist/config.yaml.example
            dist/env.example
            dist/chk-a.service
            dist/logrotate.chk-a
            dist/scripts.tar.gz
            dist/img.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}