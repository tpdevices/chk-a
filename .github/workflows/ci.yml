name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install -e .[dev]
          uv pip install -r requirements.txt

      - name: Run tests
        run: |
          uv run pytest tests/ -v --tb=short

      - name: Security audit (pip-audit)
        run: |
          uv pip install pip-audit
          pip-audit -r requirements.txt --desc

      - name: Check formatting (black)
        run: |
          uv run black --check src/ tests/

      - name: Lint (flake8)
        run: |
          uv run flake8 src/ tests/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install -e .[dev]
          uv pip install -r requirements.txt

      - name: Run pip-audit (vulnerability scan)
        run: |
          uv pip install pip-audit
          pip-audit -r requirements.txt --desc --format=json --output=pip-audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

      - name: Check for known vulnerabilities
        run: |
          if [ -f pip-audit-report.json ]; then
            VULN_COUNT=$(jq '.vulnerabilities | length' pip-audit-report.json 2>/dev/null || echo 0)
            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "⚠️ Found $VULN_COUNT vulnerabilities"
              jq '.vulnerabilities[] | "\(.package) \(.installed_version) -> \(.fixed_versions[])"' pip-audit-report.json
              exit 1
            else
              echo "✅ No known vulnerabilities found"
            fi
          fi

  validate-config:
    name: Validate Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install package
        run: |
          uv pip install -e .

      - name: Validate config (dev settings)
        run: |
          CHK_A_BASELINE_DIR=/tmp uv run chk-a-validate

      - name: Validate config (example)
        run: |
          cp config/chk-a.config.yaml.example /tmp/test-config.yaml
          CHK_A_BASELINE_DIR=/tmp CHK_A_CONFIG=/tmp/test-config.yaml uv run chk-a-validate

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          config-file: ".github/dependency-review-config.yml"
          fail-on-severity: moderate