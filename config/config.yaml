# chk-a Configuration (multi-agent DNS A-record anomaly monitor)
# Copy to /etc/chk-a/config.yaml and edit. Secrets use ${ENV} substitution.

fqdns:
  - name: "example.com"
    expected_ips: ["93.184.216.34"]   # optional allowlist
    min_consensus: 0.6
  - name: "api.github.com"
    min_consensus: 0.5

resolvers:
  # Standard DNS (UDP/TCP port 53)
  - name: "google"
    address: "8.8.8.8:53"
    weight: 1.0
    timeout_ms: 2000
  - name: "cloudflare"
    address: "1.1.1.1:53"
    weight: 1.0
    timeout_ms: 2000
  - name: "quad9"
    address: "9.9.9.9:53"
    weight: 1.0
    timeout_ms: 2000
  - name: "fake-resolver"
    address: "10.255.255.1:53"
    weight: 1.0
    timeout_ms: 1000

  # DNS-over-HTTPS (DoH) - RFC 8484
  # Uncomment and configure as needed:
  # - name: "google-doh"
  #   address: "https://dns.google/dns-query"
  #   weight: 1.0
  #   timeout_ms: 3000
  # - name: "cloudflare-doh"
  #   address: "https://cloudflare-dns.com/dns-query"
  #   weight: 1.0
  #   timeout_ms: 3000

  # DNS-over-TLS (DoT) - RFC 7858
  # Uncomment and configure as needed:
  # - name: "google-dot"
  #   address: "tls://dns.google:853"
  #   weight: 1.0
  #   timeout_ms: 3000
  # - name: "cloudflare-dot"
  #   address: "tls://1.1.1.1:853"
  #   weight: 1.0
  #   timeout_ms: 3000
  # - name: "quad9-dot"
  #   address: "tls://dns.quad9.net:853"
  #   weight: 1.0
  #   timeout_ms: 3000

ml:
  baseline_decay: 0.05
  anomaly_threshold: 0.7
  min_samples_before_alert: 10

alert:
  telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  dedup_window_minutes: 30
  rate_limit_per_hour: 20
  alert_log_path: "/var/log/chk-a/alerts.jsonl"
  alert_text_log_path: "/var/log/chk-a/alerts.log"
  dedup_cache_path: "/var/lib/chk-a/dedup_cache.json"

scheduler:
  min_interval_sec: 30
  max_interval_sec: 180
  jitter: true

logging:
  level: "INFO"
  file: "/var/log/chk-a/checks.jsonl"
  max_size_mb: 50
  backup_count: 10

mtr:
  enabled: false
  interval_sec: 300
  max_hops: 30
  count: 10
  interval_ms: 1000
  timeout_sec: 10
  mode: "icmp"
  port: null
  resolvers:
    - "google"
    - "cloudflare"
    - "quad9"

baseline_store_path: "/var/lib/chk-a/baselines.json"

reporting:
  enabled: true
  schedule_day: 1
  schedule_hour: 0
  schedule_minute: 0
  output_dir: "/var/lib/chk-a/reports"
  filename_format: "monthly-report-{timestamp}.{ext}"
  email_enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  email_from: ""
  email_to: []
  email_use_tls: true
  telegram_enabled: true
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
  include_graphs: true
  include_ml_insights: true
  lookback_days: 30
